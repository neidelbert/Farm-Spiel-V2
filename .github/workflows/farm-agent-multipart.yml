name: Farm-Agent Multipart Finalize

on:
  workflow_dispatch:
    inputs:
      ticket_header_json:
        description: MULTIPART ticket header JSON without payloadParts
        required: true
        type: string

permissions: {}

jobs:
  validate:
    name: Phase A - Assemble, validate and test without contents-write credentials
    if: github.repository == 'neidelbert/Farm-Spiel-V2' && github.actor == 'neidelbert'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      decision: ${{ steps.validate.outputs.decision }}
      ticket: ${{ steps.validate.outputs.ticket }}
      action: ${{ steps.validate.outputs.action }}
      request_id: ${{ steps.validate.outputs.request_id }}
      bundle_sha256: ${{ steps.validate.outputs.bundle_sha256 }}
      base_sha: ${{ steps.validate.outputs.base_sha }}
      result_sha: ${{ steps.validate.outputs.result_sha }}

    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Materialize multipart header
        env:
          FARM_HEADER_JSON: ${{ inputs.ticket_header_json }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path("/tmp/farm-header.json").write_text(os.environ["FARM_HEADER_JSON"], encoding="utf-8")
          PY

      - name: Assemble verified parts
        env:
          FARM_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          python3 tools/farm-agent/farm_agent.py assemble-multipart \
            --header-file /tmp/farm-header.json \
            --output-file /tmp/farm-ticket.json \
            --github-repository "$GITHUB_REPOSITORY" \
            --actions-token-env FARM_ACTIONS_TOKEN

      - name: Fresh credential-free develop checkout
        run: |
          rm -rf /tmp/farm-validate
          git clone --no-tags --branch develop "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/farm-validate

      - name: Validate and test
        id: validate
        run: |
          python3 tools/farm-agent/farm_agent.py validate \
            --ticket-file /tmp/farm-ticket.json \
            --repo-root /tmp/farm-validate \
            --github-output "$GITHUB_OUTPUT"

  publish:
    name: Phase B - Reassemble fresh and publish
    needs: validate
    if: needs.validate.result == 'success' && needs.validate.outputs.decision == 'NEW'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: farm-agent-develop-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Materialize multipart header
        env:
          FARM_HEADER_JSON: ${{ inputs.ticket_header_json }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path("/tmp/farm-header.json").write_text(os.environ["FARM_HEADER_JSON"], encoding="utf-8")
          PY

      - name: Reassemble and reverify all parts
        env:
          FARM_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          python3 tools/farm-agent/farm_agent.py assemble-multipart \
            --header-file /tmp/farm-header.json \
            --output-file /tmp/farm-ticket.json \
            --github-repository "$GITHUB_REPOSITORY" \
            --actions-token-env FARM_ACTIONS_TOKEN

      - name: Verify identity matches Phase A
        env:
          EXPECTED_REQUEST_ID: ${{ needs.validate.outputs.request_id }}
          EXPECTED_BUNDLE: ${{ needs.validate.outputs.bundle_sha256 }}
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "tools/farm-agent")
          import farm_agent
          t = farm_agent.load_ticket_file(Path("/tmp/farm-ticket.json"))
          _, bundle = farm_agent.decode_ticket_payload(t)
          assert t["requestId"] == os.environ["EXPECTED_REQUEST_ID"]
          assert bundle == os.environ["EXPECTED_BUNDLE"]
          PY

      - name: Fresh develop checkout
        run: |
          rm -rf /tmp/farm-publish
          git clone --no-tags --branch develop "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/farm-publish

      - name: Publish verified bundle non-force
        id: publish
        env:
          FARM_PUSH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/farm-agent/farm_agent.py publish \
            --ticket-file /tmp/farm-ticket.json \
            --repo-root /tmp/farm-publish \
            --push-token-env FARM_PUSH_TOKEN \
            --github-output "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Multipart publish PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- resultSha: `${{ steps.publish.outputs.result_sha }}`" >> "$GITHUB_STEP_SUMMARY"

  reuse:
    name: Idempotent reuse
    needs: validate
    if: needs.validate.result == 'success' && needs.validate.outputs.decision == 'REUSE'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: |
          echo "### Farm-Agent multipart" >> "$GITHUB_STEP_SUMMARY"
          echo "- decision: `REUSE`" >> "$GITHUB_STEP_SUMMARY"
          echo "- resultSha: `${{ needs.validate.outputs.result_sha }}`" >> "$GITHUB_STEP_SUMMARY"

name: Farm-Spiel V2.1 One-Time Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type INSTALL_V2_BOOTSTRAP
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: farm-v2-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: ${{ inputs.confirm == 'INSTALL_V2_BOOTSTRAP' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "neidelbert/Farm-Spiel-V2" || { echo "Wrong repository"; exit 10; }
          test "$GITHUB_REF_NAME" = "main" || { echo "Must run from main"; exit 11; }
          mapfile -t tracked < <(git ls-files)
          if [ "${#tracked[@]}" -ne 1 ] || [ "${tracked[0]}" != ".github/workflows/farm-bootstrap.yml" ]; then
            echo "STOP: unexpected repository contents"
            printf '%s\n' "${tracked[@]}"
            exit 12
          fi

      - name: Write trusted bootstrap files
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib
          files = {
              'README.md': '',
              '.gitignore': 'bm9kZV9tb2R1bGVzLwpkaXN0Lwpjb3ZlcmFnZS8KLnZpdGUvCl9fcHljYWNoZV9fLwoqLnB5YwouRFNfU3RvcmUKLmZhcm0tYWdlbnQvCg==',
              'tools/farm-agent/README.md': '',
              'tools/farm-agent/farm_agent.py': '',
              'tools/farm-agent/tests/test_farm_agent.py': '',
              '.github/workflows/farm-agent-selftest.yml': '',
              '.github/workflows/farm-agent.yml': '',
          }
          for rel, data in files.items():
              p = pathlib.Path(rel)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(data))
          PY

      - name: Run bootstrap tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/farm-agent/tests -p 'test_*.py' -v
          python3 tools/farm-agent/farm_agent.py selftest --repo-root "$GITHUB_WORKSPACE"

      - name: Remove one-time installer
        run: git rm .github/workflows/farm-bootstrap.yml

      - name: Commit trusted baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Farm-Spiel Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add README.md .gitignore .github tools
          git commit -m "bootstrap: install Farm-Agent V2.1 trusted baseline"
          git push origin HEAD:main

      - name: Create develop branch and baseline tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -a bootstrap-v2.1.0 -m "Farm-Spiel V2.1 trusted bootstrap baseline"
          git push origin bootstrap-v2.1.0
          git push origin HEAD:refs/heads/develop

      - name: Result
        run: |
          echo "BOOTSTRAP PASS"
          echo "main = trusted control plane"
          echo "develop = created"
          echo "tag = bootstrap-v2.1.0"

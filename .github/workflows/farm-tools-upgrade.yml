jobs:
  validate:
    name: Phase A - Validate trusted tooling without write credentials
    if: >-
      github.repository == 'neidelbert/Farm-Spiel-V2' &&
      github.actor == 'neidelbert' &&
      inputs.confirm == 'INSTALL_FARM_AGENT_V2_1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout exact installer commit without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main" || { echo "Must run from main"; exit 10; }
          test "$(git rev-parse HEAD^)" = "$FARM_BASELINE_SHA" || {
            echo "BASELINE_MISMATCH parent=$(git rev-parse HEAD^) expected=$FARM_BASELINE_SHA"
            exit 11
          }
          mapfile -t changed < <(git diff --name-only "$FARM_BASELINE_SHA..HEAD")
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != ".github/workflows/farm-tools-upgrade.yml" ]; then
            echo "STOP: installer commit contains unexpected changes"
            printf '%s\n' "${changed[@]}"
            exit 12
          fi
          DEVELOP_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/develop | cut -f1)"
          test "$DEVELOP_SHA" = "$FARM_BASELINE_SHA" || {
            echo "DEVELOP_MOVED actual=$DEVELOP_SHA expected=$FARM_BASELINE_SHA"
            exit 13
          }

      - name: Materialize exact trusted tools bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, re, sys

          encoded = "".join(os.environ["FARM_TOOLS_BUNDLE_B64"].split())
          compressed = base64.b64decode(encoded, validate=True)
          actual_bundle = hashlib.sha256(compressed).hexdigest()
          expected_bundle = os.environ["FARM_TOOLS_BUNDLE_SHA256"]
          if actual_bundle != expected_bundle:
              raise SystemExit(f"TOOLS_BUNDLE_HASH_MISMATCH {actual_bundle} != {expected_bundle}")

          raw = gzip.decompress(compressed)
          bundle = json.loads(raw.decode("utf-8"))
          if bundle.get("bundleFormat") != "farm-tools-upgrade-v1":
              raise SystemExit("TOOLS_BUNDLE_FORMAT_INVALID")
          if bundle.get("version") != "1.0.0-v2.1":
              raise SystemExit("TOOLS_BUNDLE_VERSION_INVALID")

          allowed = {
              ".github/workflows/farm-agent.yml",
              ".github/workflows/farm-agent-selftest.yml",
              ".github/workflows/farm-agent-stage.yml",
              ".github/workflows/farm-agent-multipart.yml",
              ".github/workflows/farm-agent-diagnostics.yml",
              "tools/farm-agent/farm_agent.py",
              "tools/farm-agent/tests/test_farm_agent.py",
              "tools/farm-agent/README.md",
              "tools/farm-agent/IPHONE_CONTROL_CENTER.md",
              "tools/farm-agent/schemas/farm-ticket-v2.schema.json",
          }
          files = bundle.get("files")
          if not isinstance(files, dict) or set(files) != allowed:
              raise SystemExit("TOOLS_BUNDLE_SCOPE_MISMATCH")

          for rel, item in files.items():
              if rel.startswith("/") or ".." in pathlib.PurePosixPath(rel).parts or "\\" in rel:
                  raise SystemExit(f"TOOLS_PATH_INVALID {rel}")
              content = base64.b64decode(item["contentB64"], validate=True)
              actual = hashlib.sha256(content).hexdigest()
              if actual != item["sha256"]:
                  raise SystemExit(f"TOOLS_FILE_HASH_MISMATCH {rel}")
              p = pathlib.Path(rel)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(content)
          print(f"TOOLS_BUNDLE_OK files={len(files)} sha256={actual_bundle}")
          PY

      - name: Python syntax and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/farm-agent/farm_agent.py tools/farm-agent/tests/test_farm_agent.py
          python3 -m unittest discover -s tools/farm-agent/tests -p 'test_*.py' -v
          python3 tools/farm-agent/farm_agent.py selftest --repo-root "$GITHUB_WORKSPACE"

      - name: Static workflow safety checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          required = [
              ".github/workflows/farm-agent.yml",
              ".github/workflows/farm-agent-selftest.yml",
              ".github/workflows/farm-agent-stage.yml",
              ".github/workflows/farm-agent-multipart.yml",
              ".github/workflows/farm-agent-diagnostics.yml",
          ]
          for rel in required:
              text = Path(rel).read_text(encoding="utf-8")
              if "\t" in text:
                  raise SystemExit(f"TAB_IN_YAML {rel}")
              if "--force" in text:
                  raise SystemExit(f"FORCE_PUSH_STRING {rel}")
          main = Path(".github/workflows/farm-agent.yml").read_text(encoding="utf-8")
          assert "contents: write" in main
          assert "persist-credentials: false" in main
          assert "farm-agent-develop-publish" in main
          agent = Path("tools/farm-agent/farm_agent.py").read_text(encoding="utf-8")
          for needle in (
              "REQUEST_ID_CONFLICT",
              "BUNDLE_HASH_MISMATCH",
              "PART_HASH_MISMATCH",
              "REMOTE_MOVED",
              "PATH_TRAVERSAL",
              "SYMLINK_ESCAPE",
              "UNEXPECTED_CHANGED_FILE",
              "TEST_ISOLATION_UNAVAILABLE",
          ):
              if needle not in agent:
                  raise SystemExit(f"MISSING_SECURITY_CODE {needle}")
          print("STATIC_SAFETY_PASS")
          PY

      - name: Candidate file hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = json.loads(Path("tools/farm-agent/schemas/farm-ticket-v2.schema.json").read_text())
          assert root["title"] == "Farm-Spiel V2 FarmTicket"
          for p in sorted([
              *Path(".github/workflows").glob("farm-agent*.yml"),
              *Path("tools/farm-agent").rglob("*"),
          ]):
              if p.is_file():
                  print(hashlib.sha256(p.read_bytes()).hexdigest(), p)
          PY

  publish:
    name: Phase B - Publish exact trusted tooling
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout exact installer commit with temporary trusted token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.FARM_TOOLS_TOKEN }}
          persist-credentials: true

      - name: Reverify remote state
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          DEVELOP_SHA="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$MAIN_SHA" = "$GITHUB_SHA" || {
            echo "REMOTE_MOVED main=$MAIN_SHA expected=$GITHUB_SHA"
            exit 20
          }
          test "$DEVELOP_SHA" = "$FARM_BASELINE_SHA" || {
            echo "REMOTE_MOVED develop=$DEVELOP_SHA expected=$FARM_BASELINE_SHA"
            exit 21
          }
          test "$(git rev-parse HEAD^)" = "$FARM_BASELINE_SHA" || exit 22

      - name: Materialize and reverify exact trusted tools bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib

          encoded = "".join(os.environ["FARM_TOOLS_BUNDLE_B64"].split())
          compressed = base64.b64decode(encoded, validate=True)
          actual_bundle = hashlib.sha256(compressed).hexdigest()
          if actual_bundle != os.environ["FARM_TOOLS_BUNDLE_SHA256"]:
              raise SystemExit("TOOLS_BUNDLE_HASH_MISMATCH")

          bundle = json.loads(gzip.decompress(compressed).decode("utf-8"))
          for rel, item in bundle["files"].items():
              content = base64.b64decode(item["contentB64"], validate=True)
              if hashlib.sha256(content).hexdigest() != item["sha256"]:
                  raise SystemExit(f"TOOLS_FILE_HASH_MISMATCH {rel}")
              p = pathlib.Path(rel)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(content)

          # Verify every materialized byte once more from disk.
          for rel, item in bundle["files"].items():
              if hashlib.sha256(pathlib.Path(rel).read_bytes()).hexdigest() != item["sha256"]:
                  raise SystemExit(f"TOOLS_DISK_HASH_MISMATCH {rel}")
          print("TOOLS_BUNDLE_REVERIFIED")
          PY

      - name: Remove one-time upgrader and enforce exact changed-file set
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/farm-tools-upgrade.yml
          python3 - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/farm-tools-upgrade.yml",
              ".github/workflows/farm-agent.yml",
              ".github/workflows/farm-agent-selftest.yml",
              ".github/workflows/farm-agent-stage.yml",
              ".github/workflows/farm-agent-multipart.yml",
              ".github/workflows/farm-agent-diagnostics.yml",
              "tools/farm-agent/farm_agent.py",
              "tools/farm-agent/tests/test_farm_agent.py",
              "tools/farm-agent/README.md",
              "tools/farm-agent/IPHONE_CONTROL_CENTER.md",
              "tools/farm-agent/schemas/farm-ticket-v2.schema.json",
          }
          status = subprocess.run(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True, capture_output=True, check=True
          ).stdout.splitlines()
          actual = set()
          for line in status:
              if not line:
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              actual.add(path)
          if actual != expected:
              raise SystemExit(f"UNEXPECTED_CHANGED_FILE expected={sorted(expected)} actual={sorted(actual)}")
          print("EXACT_CHANGESET_PASS")
          PY

      - name: Commit and push main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Farm-Spiel Trusted Tools"
          git config user.email "farm-tools@users.noreply.github.com"
          git add -A -- .github tools/farm-agent
          git commit -m "TOOLS-001..004: install Farm-Agent V2.1 production tooling"
          RESULT_SHA="$(git rev-parse HEAD)"
          PARENT_SHA="$(git rev-parse HEAD^)"
          test "$PARENT_SHA" = "$GITHUB_SHA" || {
            echo "COMMIT_PARENT_MISMATCH"
            exit 30
          }

          MAIN_REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          DEVELOP_REMOTE="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$MAIN_REMOTE" = "$GITHUB_SHA" || { echo "REMOTE_MOVED main"; exit 31; }
          test "$DEVELOP_REMOTE" = "$FARM_BASELINE_SHA" || { echo "REMOTE_MOVED develop"; exit 32; }

          git push origin "$RESULT_SHA:refs/heads/main"

          if git ls-remote --exit-code --tags origin refs/tags/farm-agent-v2.1.0 >/dev/null 2>&1; then
            echo "TAG_ALREADY_EXISTS"
            exit 33
          fi
          git tag -a farm-agent-v2.1.0 -m "Farm-Agent V2.1 production tooling"
          git push origin refs/tags/farm-agent-v2.1.0

          # develop is still exactly the bootstrap baseline, therefore this is a normal fast-forward.
          git push origin "$RESULT_SHA:refs/heads/develop"

          MAIN_VERIFY="$(git ls-remote origin refs/heads/main | cut -f1)"
          DEVELOP_VERIFY="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$MAIN_VERIFY" = "$RESULT_SHA" || exit 34
          test "$DEVELOP_VERIFY" = "$RESULT_SHA" || exit 35

          echo "TOOLS_UPGRADE_PASS"
          echo "RESULT_SHA=$RESULT_SHA"

      - name: Final summary
        run: |
          echo "### Farm-Agent V2.1 Tools Upgrade PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- agent: `1.0.0-v2.1`" >> "$GITHUB_STEP_SUMMARY"
          echo "- INLINE INSTALL/CLOSE: `enabled`" >> "$GITHUB_STEP_SUMMARY"
          echo "- MULTIPART: `enabled`" >> "$GITHUB_STEP_SUMMARY"
          echo "- diagnostics: `enabled`" >> "$GITHUB_STEP_SUMMARY"
          echo "- normal target: `develop`" >> "$GITHUB_STEP_SUMMARY"
          echo "- push: `non-force`" >> "$GITHUB_STEP_SUMMARY"
